<!DOCTYPE html>
<html>
<head>
  <title>YouTube Download Tester</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    input { width: 100%; padding: 8px; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .results { margin-top: 20px; }
    .section { margin: 20px 0; }
    .item { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 4px; }
    .error { color: red; }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>YouTube Download API Tester</h1>
  <input id="urlInput" type="text" placeholder="Paste YouTube URL here" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
  <button id="fetchBtn">Get Download Links</button>
  <div id="results" class="results"></div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return alert('Please enter a YouTube URL');

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = 'Loading...';

      try {
        const res = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        let html = `<h3>Video ID: ${data.videoId}</h3>`;

        html += `<div class="section"><h4>Video Qualities (MP4)</h4>`;
        data.videoQualities.forEach(q => {
          if (q.downloadUrl) {
            html += `<div class="item"><a href="${q.downloadUrl}" target="_blank">${q.label}</a></div>`;
          } else {
            html += `<div class="item error">${q.label} – ${q.error}</div>`;
          }
        });
        html += `</div>`;

        html += `<div class="section"><h4>Audio Qualities (MP3)</h4>`;
        data.audioQualities.forEach(q => {
          if (q.downloadUrl) {
            html += `<div class="item"><a href="${q.downloadUrl}" target="_blank">${q.label}</a></div>`;
          } else {
            html += `<div class="item error">${q.label} – ${q.error}</div>`;
          }
        });
        html += `</div>`;

        resultsDiv.innerHTML = html;
      } catch (err) {
        resultsDiv.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
